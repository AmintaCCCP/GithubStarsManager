name = "github-stars-vectorize"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# AUTH_TOKEN 通过 wrangler secret put AUTH_TOKEN 设置，不要写在 [vars] 中

[vars]
# 多账号共享同一索引时，/cleanup 需要按 accountId 元数据过滤。
# ⚠️ 默认值保持 "false"（Issue #612 R2-A29 注释更正）：
#   - 默认 "false" 时 /status 返回 accountScopedCleanup:false，客户端对严格账号
#     范围的检索会跳过稠密向量召回、降级为本地关键词/词法检索，不会发出无过滤
#     的向量查询（无过滤兼容查询仅在调用方显式传 allowLegacyUnscoped 时使用）；
#   - 未回填存量向量就直接设 "true" 会启用账号过滤，但元数据索引外的存量
#     旧向量仍可能无法命中（漏召回）。
# 启用必须走「部署/验证脚本确认」路径，而不是依赖本默认值。区分「验证启用」
# 与「生产启用」：先临时启用验证（失败立即回滚），全部通过后再把显式标记
# 持久化为生产配置：
#   1. 创建元数据索引（存量向量需重新写入后才会带上 accountId）：
#      npx wrangler vectorize create-metadata-index <index-name> --property-name=accountId --type=string
#   2. 回填存量向量（见 README「多账号」一节：在客户端重新分析并重建；
#      无法重新分析的仓库在恢复分析状态前不会被账号过滤查询召回）。
#   3. 临时启用并验证（不影响 wrangler.toml 默认值）：
#      `npx wrangler deploy --var ACCOUNT_METADATA_INDEXED:true`
#      随后执行冒烟检查：用账号过滤查询确认能命中该账号的向量（见 README）。
#      注意：单账号查询命中只能证明「过滤生效」，不能证明全量回填完成。
#   4. 确认回填覆盖后再正式启用：用回填清单或完整枚举核对所有预期向量均已
#      回填（`npx wrangler vectorize list-vectors <index-name>` 全量枚举向量 ID，
#      不应再存在纯数字 legacy ID），然后用部署向导（cloudflare-worker/deploy.mjs）
#      写入显式标记并持久化到 .deploy-config.json；
#      绝不能按客户端本机账号数量推断归属。
ACCOUNT_METADATA_INDEXED = "false"

[[vectorize]]
binding = "VECTORIZE"
index_name = "github-stars"
