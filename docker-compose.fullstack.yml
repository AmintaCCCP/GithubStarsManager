services:
  app:
    image: ghcr.io/amintacccp/github-stars-manager-fullstack:${IMAGE_TAG:-latest}
    ports:
      - "8080:3000"
    environment:
      API_SECRET: ${API_SECRET:?Set API_SECRET in .env before starting the full-stack deployment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CSP_UPGRADE_INSECURE_REQUESTS: ${CSP_UPGRADE_INSECURE_REQUESTS:-true}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      GITHUB_OAUTH_FRONTEND_URL: ${GITHUB_OAUTH_FRONTEND_URL:-}
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data:
