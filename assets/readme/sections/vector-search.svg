  <text x="120" y="58" fill="#8ea2c9" font-size="16" font-weight="700" letter-spacing="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">SEMANTIC NEIGHBORHOOD</text>
