<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0e1b38"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- constellation grid -->
  <g stroke="#3d5a99" stroke-opacity="0.35" stroke-width="1">
    <circle cx="80" cy="70" r="1.6" fill="#3d5a99" stroke="none"/>
    <circle cx="1120" cy="60" r="1.6" fill="#3d5a99" stroke="none"/>
    <circle cx="1060" cy="340" r="1.6" fill="#3d5a99" stroke="none"/>
    <circle cx="140" cy="350" r="1.6" fill="#3d5a99" stroke="none"/>
  </g>

  <!-- left: title block -->
  <g>
    <g transform="translate(72,86)">
      <circle cx="34" cy="34" r="34" fill="url(#glow)"/>
      <path d="M34 14 l6.2 12.6 13.9 2 -10.1 9.8 2.4 13.9 -12.4 -6.5 -12.4 6.5 2.4 -13.9 -10.1 -9.8 13.9 -2 Z" fill="url(#star)"/>
      <text x="86" y="34" fill="#e8edf7" font-size="44" font-weight="700" letter-spacing="0.5">
        GitHub Stars Manager
      </text>
      <text x="88" y="66" fill="#8ea2c9" font-size="19">
        AI-organized stars · vector search · release radar · all local-first
      </text>
    </g>

    <!-- feature chips -->
    <g font-size="16" font-weight="600">
      <g transform="translate(72,186)">
        <rect width="172" height="40" rx="20" fill="#16224a" stroke="#3d5a99" stroke-opacity="0.5"/>
        <text x="86" y="26" fill="#9ecbff" text-anchor="middle">AI management</text>
      </g>
      <g transform="translate(256,186)">
        <rect width="164" height="40" rx="20" fill="#16224a" stroke="#3d5a99" stroke-opacity="0.5"/>
        <text x="82" y="26" fill="#9ecbff" text-anchor="middle">Vector search</text>
      </g>
      <g transform="translate(432,186)">
        <rect width="126" height="40" rx="20" fill="#16224a" stroke="#3d5a99" stroke-opacity="0.5"/>
        <text x="63" y="26" fill="#9ecbff" text-anchor="middle">Repo Q&amp;A</text>
      </g>
      <g transform="translate(72,240)">
        <rect width="100" height="40" rx="20" fill="#1a2b3d" stroke="#3d8066" stroke-opacity="0.5"/>
        <text x="50" y="26" fill="#8fdcb8" text-anchor="middle">MCP</text>
      </g>
      <g transform="translate(184,240)">
        <rect width="162" height="40" rx="20" fill="#1a2b3d" stroke="#3d8066" stroke-opacity="0.5"/>
        <text x="81" y="26" fill="#8fdcb8" text-anchor="middle">Release tracking</text>
      </g>
      <g transform="translate(358,240)">
        <rect width="128" height="40" rx="20" fill="#1a2b3d" stroke="#3d8066" stroke-opacity="0.5"/>
        <text x="64" y="26" fill="#8fdcb8" text-anchor="middle">100% local</text>
      </g>
    </g>

    <!-- fake prompt -->
    <g transform="translate(72,320)">
      <rect width="486" height="52" rx="12" fill="#0d1730" stroke="#2c3f6e"/>
      <circle cx="26" cy="26" r="5" fill="#f5a623"/>
      <text x="46" y="31" fill="#c7d4ec" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">find repos like astro but for content sites</text>
      <circle cx="452" cy="26" r="10" fill="none" stroke="#4f8cff" stroke-width="2"/>
      <line x1="459" y1="33" x2="468" y2="42" stroke="#4f8cff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- right: vector constellation of similar repos -->
  <g transform="translate(690,40)">
    <circle cx="250" cy="190" r="150" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7"/>
    <circle cx="250" cy="190" r="105" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="2 6" opacity="0.45"/>

    <g stroke="#4f8cff" stroke-opacity="0.45" stroke-width="1.4">
      <line x1="250" y1="190" x2="250" y2="70"/>
      <line x1="250" y1="190" x2="130" y2="130"/>
      <line x1="250" y1="190" x2="370" y2="130"/>
      <line x1="250" y1="190" x2="110" y2="250"/>
      <line x1="250" y1="190" x2="390" y2="250"/>
      <line x1="250" y1="190" x2="180" y2="316"/>
      <line x1="250" y1="190" x2="320" y2="316"/>
      <line x1="130" y1="130" x2="250" y2="70" opacity="0.6"/>
      <line x1="370" y1="130" x2="250" y2="70" opacity="0.6"/>
    </g>

    <!-- center seed repo -->
    <g>
      <circle cx="250" cy="190" r="52" fill="url(#glow)"/>
      <circle cx="250" cy="190" r="40" fill="#14234a" stroke="#f5a623" stroke-width="2"/>
      <path d="M250 166 l7.4 15 16.6 2.4 -12 11.7 2.8 16.6 -14.8 -7.8 -14.8 7.8 2.8 -16.6 -12 -11.7 16.6 -2.4 Z" fill="url(#star)"/>
    </g>

    <!-- satellite repo nodes -->
    <g font-size="13" fill="#c7d4ec">
      <g><circle cx="250" cy="70" r="16" fill="#16224a" stroke="#4f8cff" stroke-width="1.5"/><text x="250" y="48" text-anchor="middle">astro</text></g>
      <g><circle cx="130" cy="130" r="13" fill="#16224a" stroke="#4f8cff" stroke-width="1.5"/><text x="112" y="108" text-anchor="middle">hugo</text></g>
      <g><circle cx="370" cy="130" r="13" fill="#16224a" stroke="#4f8cff" stroke-width="1.5"/><text x="388" y="108" text-anchor="middle">vitepress</text></g>
      <g><circle cx="110" cy="250" r="11" fill="#16224a" stroke="#3d5a99" stroke-width="1.5"/><text x="88" y="276" text-anchor="middle">hexo</text></g>
      <g><circle cx="390" cy="250" r="11" fill="#16224a" stroke="#3d5a99" stroke-width="1.5"/><text x="412" y="276" text-anchor="middle">docusaurus</text></g>
      <g><circle cx="180" cy="316" r="9" fill="#16224a" stroke="#3d5a99" stroke-width="1.5"/><text x="168" y="342" text-anchor="middle">eleventy</text></g>
      <g><circle cx="320" cy="316" r="9" fill="#16224a" stroke="#3d5a99" stroke-width="1.5"/><text x="330" y="342" text-anchor="middle">mkdocs</text></g>
    </g>

    <text x="250" y="368" text-anchor="middle" fill="#8ea2c9" font-size="14">similar repositories · semantic neighborhood</text>
  </g>
</svg>
