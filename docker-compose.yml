version: '3.8'

services:
  frontend:
    image: ghcr.io/amintacccp/github-stars-manager-frontend:${FRONTEND_IMAGE_TAG:-latest}
    # Uncomment below (and comment out 'image') to build locally instead:
    # build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-backend:3000}
    restart: unless-stopped

  backend:
    image: ghcr.io/amintacccp/github-stars-manager-server:${BACKEND_IMAGE_TAG:-latest}
    # Uncomment below (and comment out 'image') to build locally instead:
    # build: ./server
    expose:
      - "3000"
    environment:
      # Security hardening: leaving API_SECRET empty no longer disables auth.
      # The backend then generates a random secret on first start and stores it
      # in the data volume (data/.api-secret). Retrieve it with:
      #   docker compose exec backend cat /app/data/.api-secret
      # Explicitly setting API_SECRET (e.g. in a root .env file) is recommended.
      - API_SECRET=${API_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TRUST_PROXY=1
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  backend-data: