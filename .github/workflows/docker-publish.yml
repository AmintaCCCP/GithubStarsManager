name: Publish Backend Docker Image to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

# Keep only the newest attempt for each PR. Non-PR runs get unique groups, and
# the publish job below serializes registry writes without dropping revisions.
concurrency:
  group: backend-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/github-stars-manager-backend
  # Compatibility alias used by the existing docker-compose.yml and direct users.
  LEGACY_IMAGE_NAME: ${{ github.repository_owner }}/github-stars-manager-server

jobs:
  validate:
    if: github.event_name == 'pull_request'
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26.04 between 2026-10-19 and
    # 2026-11-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    # Warm-cache runs land around a minute; a lockfile change re-runs npm ci
    # for both platforms (~3-4 minutes based on the sibling fullstack job).
    # The arm64 npm ci under QEMU emulation stalls occasionally; the timeout
    # turns a hung run into a visible failure worth a re-run instead of an
    # all-day zombie job.
    timeout-minutes: 60
    # PR validation does not authenticate to GHCR and cannot publish packages.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Validate backend multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          # Both platforms must be validated: arm64 (soft-router deployments)
          # ships from this same Dockerfile on publish, and a broken arm64
          # npm ci would otherwise only surface after the merge, failing the
          # main-branch publish entirely.
          platforms: linux/amd64,linux/arm64
          push: false
          # Fork PRs may fall back to the default branch's publish cache, so a
          # cold fork PR reuses the latest main build layers instead of timing
          # out on a from-scratch build.
          cache-from: |
            type=gha,scope=github-stars-manager-backend-pr,timeout=5m
            type=gha,scope=github-stars-manager-backend-branch,timeout=5m
          cache-to: type=gha,scope=github-stars-manager-backend-pr,mode=max,timeout=5m,ignore-error=true

  build-and-push:
    # Only main and release tags may publish: pull_request runs validate only,
    # and workflow_dispatch can target any branch, where a manual run must
    # neither publish images nor overwrite the default branch's cache scope.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    # Keep every main/tag revision pending instead of replacing older runs.
    concurrency:
      group: backend-image-publish
      cancel-in-progress: false
      queue: max
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26.04 between 2026-10-19 and
    # 2026-11-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    # Avoid an unbounded blocked cache or registry operation.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag matches client version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.cjs "$GITHUB_REF_NAME"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # tag push → "v1.2.3", "1.2.3", "1.2", "1"
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # every build → sha-abc1234
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Do not share the default `buildkit` scope with frontend or full-stack images.
          cache-from: type=gha,scope=github-stars-manager-backend-${{ github.ref_type }},timeout=5m
          cache-to: type=gha,scope=github-stars-manager-backend-${{ github.ref_type }},mode=max,timeout=5m,ignore-error=true

      - name: Move latest to this build when it is current main
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_sha" != "$CANDIDATE_SHA" ]; then
            echo "Skipping latest: $CANDIDATE_SHA is not the current main head ($current_sha)."
            exit 0
          fi
          test -n "$DIGEST"
          image="${REGISTRY}/${IMAGE_NAME,,}"
          legacy="${REGISTRY}/${LEGACY_IMAGE_NAME,,}"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${legacy}:latest" \
            "${image}@${DIGEST}"
