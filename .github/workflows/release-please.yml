name: Release Please

on:
  push:
    branches: [main]

# release-please maintains its release branch, opens/updates the version PR,
# and after the PR merge cuts the vX.Y.Z tag and GitHub release — all with the
# default GITHUB_TOKEN identity (github-actions[bot]).
permissions:
  contents: write
  pull-requests: write
  # Needed by the dispatch step below to start the tag-triggered release
  # workflows (workflow_dispatch) for the freshly cut tag.
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  # Do not cancel an in-flight run: two overlapping runs could both try to
  # update the open release PR. release-please is idempotent, so queueing is
  # safe and a cancelled mid-write run is not.
  cancel-in-progress: false

jobs:
  release-please:
    # Pinned instead of `ubuntu-latest`: that label migrates to Ubuntu 26.04
    # between 2026-10-19 and 2026-11-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Dispatch release workflows for the new tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repository from a
          # git remote — set it explicitly.
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not emit push events (GitHub
          # suppresses workflow triggers for events created by the default
          # token), so a freshly cut vX.Y.Z tag would never start
          # build-desktop or the docker publish workflows and the release
          # would ship without installers or images. workflow_dispatch is the
          # documented exception that does start runs.
          if [ -z "$TAG_NAME" ]; then
            echo "release-please reported a release without tag_name; nothing to dispatch"
            exit 0
          fi
          for workflow in build-desktop.yml docker-publish-frontend.yml docker-publish.yml docker-publish-fullstack.yml; do
            gh workflow run "$workflow" --ref "$TAG_NAME"
            echo "Dispatched ${workflow} for ${TAG_NAME}"
          done
