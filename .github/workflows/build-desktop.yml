name: Build Desktop App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Only a newer pull request attempt may cancel an older one. Main commits and
# release tags always finish so every shipped revision has a complete run.
concurrency:
  group: build-desktop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests and ordinary builds receive only repository read access. The
# release job elevates this explicitly when it creates a tagged GitHub release.
permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: Desktop scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect docs-only pull request
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SCOPE_ROOT: ${{ github.workspace }}
        run: |
          # Pull request code is untrusted; execute the scope logic from base.
          script="$RUNNER_TEMP/ci-scope.cjs"
          if git cat-file blob "${PR_BASE_SHA}:scripts/ci-scope.cjs" >"$script" 2>/dev/null; then
            node "$script"
          else
            echo "::warning::Trusted ci-scope script unavailable; running full CI"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Build web bundle
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tagged release version
        if: github.ref_type == 'tag'
        run: node scripts/check-release-version.cjs "$GITHUB_REF_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Assert relative asset paths
        shell: bash
        run: |
          test -f dist/index.html
          if grep -qE '(href|src)="/' dist/index.html; then
            echo "dist/index.html contains absolute asset paths:"
            grep -nE '(href|src)="/' dist/index.html | head -10
            exit 1
          fi

      - name: Upload web bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  build:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    # Desktop packaging legs have historically landed well under 30 minutes,
    # but macOS/Windows packaging plus the 3-attempt electron-builder retry
    # loop can spike far beyond that; 120 minutes keeps roughly 2x margin over
    # the worst spikes while a hung runner still fails instead of blocking the
    # run until GitHub's 6-hour default.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned instead of `ubuntu-latest`: that label migrates to
        # Ubuntu 26.04 between 2026-10-19 and 2026-11-19
        # (actions/runner-images#14748), which would silently rebuild the Linux
        # AppImage against a newer glibc. Platform steps below match with
        # startsWith(matrix.os, 'ubuntu'), so a future re-pin needs no edits.
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Cache Electron and electron-builder binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Bump this key when Electron or electron-builder changes. Keeping the
        # exact version in the key is what makes a newly downloaded toolchain
        # persist instead of being masked by a permanent cache hit.
        path: |
          ${{ runner.os == 'Linux' && '~/.cache/electron' || runner.os == 'macOS' && '~/Library/Caches/electron' || '~/AppData/Local/electron/Cache' }}
          ${{ runner.os == 'Linux' && '~/.cache/electron-builder' || runner.os == 'macOS' && '~/Library/Caches/electron-builder' || '~/AppData/Local/electron-builder/Cache' }}
        key: electron-bin-${{ runner.os }}-electron45-eb26
        restore-keys: electron-bin-${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Prepare build resources
      shell: bash
      run: |
        # electron-builder converts the source PNG to .ico/.icns itself.
        mkdir -p build
        cp assets/icon.png build/icon.png
        cp assets/icon.png build/icon-512x512.png
        cp assets/dmg-background.png build/background.png
        cp assets/dmg-background@2x.png build/background@2x.png
        if [ -f "scripts/mac/Fix Damaged App.command" ]; then
          chmod +x "scripts/mac/Fix Damaged App.command"
        fi
        echo "Build resources prepared:"
        ls -la build/

    - name: Install system dependencies (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        # Microsoft apt sources on GitHub runners occasionally return 403 and break
        # apt-get update for unrelated electron deps. Disable them before update.
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
          /etc/apt/sources.list.d/microsoft-prod.list \
          /etc/apt/sources.list.d/microsoft-prod.list.save 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y xvfb libnss3-dev libatk-bridge2.0-dev libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2-dev

    - name: Verify committed Electron sources
      shell: bash
      run: |
        # Do NOT regenerate electron/main.js — committed sources include MCP IPC + local server.
        # Older CI overwrote this directory and stripped MCP, leaving Settings token with no listener.
        set -euo pipefail
        required=(
          electron/main.js
          electron/preload.js
          electron/mcpLocalServer.js
          electron/package.json
        )
        for f in "${required[@]}"; do
          if [ ! -f "$f" ]; then
            echo "Missing required Electron file: $f"
            exit 1
          fi
        done
        if ! grep -q "createMcpLocalServer" electron/main.js; then
          echo "electron/main.js is missing MCP wiring (createMcpLocalServer)"
          exit 1
        fi
        if ! grep -q "mcp:setConfig" electron/main.js; then
          echo "electron/main.js is missing mcp:setConfig IPC handler"
          exit 1
        fi
        if ! grep -q "mcp:" electron/preload.js; then
          echo "electron/preload.js is missing electronAPI.mcp bridge"
          exit 1
        fi
        echo "Electron sources OK (MCP wired):"
        ls -la electron/

    - name: Configure macOS signing
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        # Only set CSC_LINK when a signing certificate is actually configured.
        # An empty CSC_LINK causes electron-builder to treat CWD as a cert
        # file and fail with "not a file".
        if [ -n "$CSC_LINK_SECRET" ]; then
          {
            echo "CSC_LINK<<__EOF__"
            echo "$CSC_LINK_SECRET"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
          if [ -n "$CSC_KEY_PASSWORD_SECRET" ]; then
            {
              echo "CSC_KEY_PASSWORD<<__EOF__"
              echo "$CSC_KEY_PASSWORD_SECRET"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          fi
          echo "Signing certificate configured"
        else
          echo "No signing certificate — electron-builder will ad-hoc sign"
        fi
      env:
        CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}

    - name: Download web bundle when ready
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # Install dependencies and platform tooling while the single web build
        # runs, then wait only for its artifact instead of the whole web job.
        # Keep waiting past the web job's 15-minute timeout plus upload time.
        for _ in $(seq 1 192); do
          if gh run download "$GITHUB_RUN_ID" --name web-dist --dir dist >/dev/null 2>&1; then
            exit 0
          fi
          sleep 5
        done
        echo "::error::web-dist artifact was not available within 16 minutes"
        exit 1

    - name: Verify downloaded web bundle
      shell: bash
      run: test -f dist/index.html

    - name: Build Electron app
      shell: bash
      run: |
        n=0
        until [ "$n" -ge 3 ]; do
          npm run dist -- --publish=never && break
          n=$((n+1))
          if [ "$n" -lt 3 ]; then
            echo "Build Electron app failed, retrying in 15s... (attempt $n/3)"
            sleep 15
          fi
        done
        if [ "$n" -ge 3 ]; then
          echo "Build Electron app failed after 3 attempts"
          exit 1
        fi
      env:
        # Only tagged release builds receive a token; PR and branch builds never
        # expose a credential to package scripts or electron-builder hooks.
        GH_TOKEN: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || '' }}
        CI: true

    - name: Verify packaged artifact
      shell: bash
      run: |
        case "${{ matrix.os }}" in
          windows-*)
            artifacts="$(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) -print -quit)"
            ;;
          macos-*)
            artifacts="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            if [ -n "$artifacts" ]; then
              for dmg in release/*.dmg; do
                echo "Verifying DMG contents for $dmg..."
                mount_point="$(mktemp -d)"
                hdiutil attach "$dmg" -mountpoint "$mount_point" -nobrowse -quiet
                if [ ! -x "$mount_point/Fix Damaged App.command" ]; then
                  echo "::error::$dmg is missing executable Fix Damaged App.command"
                  hdiutil detach "$mount_point" -quiet 2>/dev/null || true
                  exit 1
                fi
                app_bundle="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
                if [ -z "$app_bundle" ]; then
                  echo "::error::$dmg is missing .app bundle"
                  hdiutil detach "$mount_point" -quiet 2>/dev/null || true
                  exit 1
                fi
                echo "Verifying code signature on $app_bundle with codesign --verify --deep --strict..."
                if ! codesign --verify --deep --strict "$app_bundle"; then
                  echo "::error::$app_bundle failed codesign --verify --deep --strict"
                  hdiutil detach "$mount_point" -quiet 2>/dev/null || true
                  exit 1
                fi
                hdiutil detach "$mount_point" -quiet 2>/dev/null || true
                echo "✓ Verified $dmg includes executable Fix Damaged App.command and passes strict codesign verification"
              done
            fi
            ;;
          ubuntu-*)
            artifacts="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
            ;;
        esac
        if [ -z "$artifacts" ]; then
          echo "No packaged artifact found for ${{ matrix.os }}"
          ls -la release/ 2>/dev/null || true
          exit 1
        fi
        echo "Found packaged artifact: $artifacts"

    - name: Test Electron app (Linux only)
      if: startsWith(matrix.os, 'ubuntu')
      shell: bash
      run: |
        # Test if the app can start (will exit quickly but should not crash)
        echo "Testing Electron app startup..."
        timeout 10s xvfb-run -a npm run electron || echo "App test completed (timeout expected)"

    - name: Upload artifacts (Windows)
      if: matrix.os == 'windows-latest' && success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-app
        path: |
          release/*.exe
          release/*.msi
        if-no-files-found: ignore
        retention-days: 31

    - name: Upload artifacts (macOS)
      if: matrix.os == 'macos-latest' && success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: macos-app
        path: release/*.dmg
        if-no-files-found: ignore
        retention-days: 31

    - name: Upload artifacts (Linux)
      if: startsWith(matrix.os, 'ubuntu') && success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: linux-app
        path: release/*.AppImage
        if-no-files-found: ignore
        retention-days: 31

  release:
    needs: [scope, web, build]
    # Tag-only. A main push must not re-run this job: softprops then replaced
    # the already published release, wiping its installers. A manual dispatch
    # on a branch is refused too — softprops would publish that branch's
    # build under the branch name, on a tag that points elsewhere.
    # Pinned: `ubuntu-latest` migrates to Ubuntu 26.04 between 2026-10-19 and
    # 2026-11-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    # Artifact download plus one release publish; several multiples of
    # headroom over the couple of minutes this job needs in practice.
    timeout-minutes: 20
    # Keep partial platform releases possible, but never publish when the tag
    # does not match the root package.json client version. NOTE: there is
    # deliberately no `needs.build.result == 'success'` gate — a matrix job's
    # needs result aggregates to 'failure' when ANY leg fails (fail-fast is
    # disabled above), so gating on it would also drop the release when a
    # single platform fails, killing the documented partial-release design.
    # The empty-release hole is closed by the explicit zero-artifact guard
    # below (which fails before anything is published) plus
    # `fail_on_unmatched_files: true`, which rejects a mismatched upload set.
    #
    # Releases are cut MANUALLY: the release notes body is authored ahead of
    # time via `gh release create <tag> --draft --notes ...`, and this job
    # only attaches the installers and flips the draft public. It deliberately
    # sets neither `body` nor `generate_release_notes` so it never overwrites
    # the hand-written notes (softprops' default update path replaces an
    # existing release's body whenever a workflow `body` is present).
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.scope.result == 'success' && needs.web.result == 'success'
    permissions:
      contents: write
      actions: read

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: '*-app'

    - name: List downloaded files
      shell: bash
      run: |
        echo "Downloaded files structure:"
        find . -type f | head -20
        echo "Looking for build artifacts:"
        find . -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" | head -20

    - name: Prepare release files
      shell: bash
      run: |
        mkdir -p release-files
        # Copy all found artifacts to a single directory
        find . -name "*.exe" -exec cp {} release-files/ \; 2>/dev/null || true
        find . -name "*.msi" -exec cp {} release-files/ \; 2>/dev/null || true
        find . -name "*.dmg" -exec cp {} release-files/ \; 2>/dev/null || true
        find . -name "*.AppImage" -exec cp {} release-files/ \; 2>/dev/null || true
        echo "Files prepared for release:"
        ls -la release-files/ || echo "No files found"

    - name: Fail when no build artifacts exist
      shell: bash
      run: |
        # Every desktop build failed (or produced nothing matching the upload
        # globs). The vX.Y.Z release is pre-created as a draft by the release
        # process before this workflow runs, so failing here leaves that draft
        # unpublished and invisible — no public release can end up without
        # installers. On success the release step below uploads the assets and
        # flips the draft public.
        if [ -z "$(find release-files -type f -print -quit 2>/dev/null)" ]; then
          echo "::error::No desktop artifacts (.exe/.msi/.dmg/.AppImage) were produced by any platform build; refusing to publish an empty release."
          exit 1
        fi

    - name: Verify a hand-authored draft release exists for this tag
      # Guard against the empty-notes hole: if the operator pushes the tag but
      # forgets to pre-create the draft, softprops would silently CREATE a new
      # release for the tag with no body (we deliberately pass neither `body`
      # nor `generate_release_notes`), publishing a public release with no
      # human-written notes. Fail here instead, before anything is created.
      #
      # The GitHub "get release by tag" endpoint 404s for drafts, so we list
      # releases and match on tag_name to find a draft the operator created.
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        json="$(gh api --paginate "repos/{owner}/{repo}/releases?per_page=100" \
          --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")][0]")"
        if [ -z "$json" ] || [ "$json" = "null" ]; then
          echo "::error::No release exists for tag $RELEASE_TAG. Create a DRAFT first: gh release create $RELEASE_TAG --draft --notes \"<hand-written notes>\""
          exit 1
        fi
        draft="$(jq -r '.draft' <<<"$json")"
        body="$(jq -r '.body // ""' <<<"$json")"
        if [ "$draft" != "true" ]; then
          echo "::error::Release for tag $RELEASE_TAG already exists but is NOT a draft. Refusing to touch a published release from CI."
          exit 1
        fi
        if [ -z "${body//[[:space:]]/}" ]; then
          echo "::error::Draft release for tag $RELEASE_TAG has an EMPTY body. Refusing to publish a release with no hand-written notes. Re-create it with: gh release create $RELEASE_TAG --draft --notes \"<hand-written notes>\""
          exit 1
        fi
        echo "✓ Draft release for $RELEASE_TAG found with a non-empty body ($(wc -c <<<"$body") bytes)"

    - name: Create Release
      # Reuses the pre-authored draft release verified above: uploads the
      # installers, then publishes it (input draft: false unmarks the draft in
      # softprops' finalize step). The notes body is intentionally NOT set here
      # — it was authored ahead of time with `gh release create <tag> --draft
      # --notes ...`, and softprops would overwrite it if a workflow `body`
      # were present. No `generate_release_notes` either, so nothing
      # machine-generated is appended to the hand-written notes.
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: release-files/*
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
